name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # API, the static admin portal, and the console at /admin74246/. System packages are installed once by deploy/server-setup.sh.
  # The Windows register is release-pos.yml; this job does not build a desktop app.
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/ai-pos
      WEB_DIR: /var/www/ai-pos-admin
      CONSOLE_DIR: /var/www/ai-pos-console
      SITE_DIR: /var/www/ai-pos-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Production build env
        run: test -f .env.production || cp deploy/portal.production.env .env.production

      - name: Build admin portal, console, and landing page
        run: |
          pnpm install --frozen-lockfile --filter "@ai-pos/web..." --filter "@ai-pos/super-admin..." --filter "@ai-pos/site..."
          pnpm build:admin:prod
          pnpm build:console:prod
          pnpm build:site:prod
          test -f apps/web/dist/index.html
          test -f apps/super-admin/dist/index.html
          test -f apps/site/dist/index.html
          test -d apps/site/dist/site-assets
          test -f apps/site/dist/pos/register.jpg
          test -f apps/site/dist/sitemap.xml
          test -f apps/site/dist/robots.txt
          test -f apps/site/dist/restaurant-pos/index.html
          test -f apps/site/dist/pos-software-uae/index.html
          grep -q 'rel="canonical" href="https://axizpos.com/"' apps/site/dist/index.html
          grep -q 'Restaurant POS System' apps/site/dist/restaurant-pos/index.html

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          ssh server 'echo connected to $(hostname)'

      - name: Prepare the server
        run: |
          rsync -az deploy/ server:ai-pos-deploy/
          ssh server "sudo -n bash ~/ai-pos-deploy/server-setup.sh"

      - name: Upload API and catalog
        run: |
          ssh server "mkdir -p $APP_DIR/apps/api $APP_DIR/packages/catalog $APP_DIR/plugins/einvoicing $WEB_DIR $CONSOLE_DIR $SITE_DIR"
          rsync -az --delete \
            --exclude '.venv/' --exclude '.env*' --exclude 'storage/' \
            --exclude '__pycache__/' --exclude 'tests/' --exclude '*.db' \
            --exclude '.pytest_cache/' --exclude '.ruff_cache/' \
            apps/api/ server:$APP_DIR/apps/api/
          rsync -az --delete packages/catalog/ server:$APP_DIR/packages/catalog/
          # The API adds /opt/ai-pos/plugins/einvoicing to sys.path at startup.
          rsync -az --delete \
            --exclude '__pycache__/' --exclude '.pytest_cache/' --exclude '.env*' --exclude 'tests/' \
            plugins/einvoicing/ server:$APP_DIR/plugins/einvoicing/

      - name: Ensure production env
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if ssh server "test -f $APP_DIR/.env.production"; then
            echo "Using the env file already on the server."
          else
            if [ -z "$ENV_PRODUCTION" ]; then
              echo "Missing $APP_DIR/.env.production."
              echo "Add the contents of the local .env.production file as the ENV_PRODUCTION secret on the production environment."
              exit 1
            fi
            tmp=$(mktemp)
            printf '%s\n' "$ENV_PRODUCTION" > "$tmp"
            scp -q "$tmp" "server:$APP_DIR/.env.production"
            rm -f "$tmp"
            ssh server "chmod 600 $APP_DIR/.env.production"
          fi
          ssh server "grep -q '^REDIS_URL=' $APP_DIR/.env.production || printf '\nREDIS_URL=redis://127.0.0.1:6379/0\n' >> $APP_DIR/.env.production"

      - name: Grant database creation
        run: ssh server "sudo -n bash ~/ai-pos-deploy/ensure-postgres.sh"

      - name: Install, migrate, restart
        run: |
          ssh server "APP_DIR=$APP_DIR bash -s" <<'EOF'
          set -euo pipefail
          test -f "$APP_DIR/.env.production" || { echo "Missing $APP_DIR/.env.production"; exit 1; }
          cd "$APP_DIR/apps/api"
          if [ ! -x .venv/bin/pip ]; then
            python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
          fi
          .venv/bin/pip install -q -r requirements.txt
          export APP_ENV=production
          .venv/bin/python -m app.tenancy.cli init
          .venv/bin/python -m app.tenancy.cli migrate-all
          EOF

      - name: Upload admin portal, console, and landing page
        run: |
          ssh server "mkdir -p $WEB_DIR $CONSOLE_DIR $SITE_DIR"
          rsync -az --delete apps/web/dist/ server:$WEB_DIR/
          rsync -az --delete apps/super-admin/dist/ server:$CONSOLE_DIR/
          rsync -az --delete apps/site/dist/ server:$SITE_DIR/

      - name: Start PM2
        run: |
          ssh server "bash -s" <<'EOF'
          set -euo pipefail
          test -f "$HOME/ai-pos-deploy/ecosystem.config.cjs"
          pm2 startOrReload "$HOME/ai-pos-deploy/ecosystem.config.cjs"
          pm2 save
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              pm2 status
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          pm2 logs ai-pos-api --lines 80 --nostream || true
          exit 1
          EOF
          ssh server "sudo -n systemctl reload nginx"

      - name: Summary
        run: |
          echo "Deployed ${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
