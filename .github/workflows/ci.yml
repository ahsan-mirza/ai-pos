name: CI

on:
  push:
  pull_request:

# Deploy listens for this workflow by name ("CI"); keep it in step with deploy.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The register is a Windows installer, built by release-pos.yml on a version tag.
      # This job checks the API, the static portal, and the POS TypeScript. It does not
      # install WebKit or compile a Linux desktop binary.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements-dev.txt
      - name: Verify
        run: pnpm verify
