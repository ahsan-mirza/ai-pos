name: Release POS

on:
  workflow_dispatch:
    inputs:
      publish_installer:
        description: Upload the signed installer to the server. A build alone does not publish.
        type: boolean
        default: false

concurrency:
  group: release-pos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Sync POS version
        run: node scripts/sync-pos-version.mjs

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons if missing
        run: test -f apps/desktop/src-tauri/icons/icon.ico || node scripts/generate-icon.mjs

      - name: Production build env
        run: test -f .env.production || cp deploy/portal.production.env .env.production

      - name: Build the Windows installer
        env:
          AXIZPOS_SIGN_THUMBPRINT: ${{ secrets.AXIZPOS_SIGN_THUMBPRINT }}
          TAURI_WINDOWS_SIGNTOOL_PATH: ${{ secrets.TAURI_WINDOWS_SIGNTOOL_PATH }}
        run: pnpm --filter @ai-pos/desktop build:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: axizpos-windows-${{ github.run_number }}
          path: |
            dist/POS-Setup-*.exe
            dist/POS-Setup-*.exe.sha256
            dist/POS-Setup-*.signing.json
          if-no-files-found: error

  # Copies the signed installer to the server. A tag push does not start this workflow.
  publish:
    needs: windows
    if: ${{ inputs.publish_installer }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DOWNLOADS_DIR: /opt/ai-pos/downloads
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: axizpos-windows-${{ github.run_number }}
          path: artifact

      - name: Stage installers and manifest
        run: |
          version=$(python3 - <<'PY'
          import pathlib, re
          names = [path.name for path in pathlib.Path("artifact").iterdir() if path.suffix.lower() == ".exe"]
          if len(names) != 1:
              raise SystemExit("The artifact must contain one installer exe.")
          match = re.fullmatch(r"POS-Setup-(.+)\.exe", names[0])
          if match is None:
              raise SystemExit("The installer name is not POS-Setup-<version>.exe.")
          print(match.group(1))
          PY
          )
          mkdir -p "release/$version"
          find artifact -type f -name 'POS-Setup-*.exe' -exec cp {} "release/$version/" \;
          find artifact -type f -name 'POS-Setup-*.exe.sha256' -exec cp {} "release/$version/" \;
          find artifact -type f -name 'POS-Setup-*.signing.json' -exec cp {} "release/$version/" \;
          python3 - "release/$version" "$version" <<'EOF'
          import hashlib, json, pathlib, sys
          from datetime import datetime, timezone

          folder, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          exe_files = sorted(folder.glob("POS-Setup-*.exe"))
          if len(exe_files) != 1:
              sys.exit("One installer exe is required before a manifest is written.")
          exe = exe_files[0]
          digest = hashlib.sha256(exe.read_bytes()).hexdigest()
          recorded = folder / f"{exe.name}.sha256"
          if not recorded.is_file() or digest not in recorded.read_text(encoding="utf-8"):
              sys.exit("The checksum file does not match the installer. The manifest was not written.")
          signing_files = list(folder.glob("POS-Setup-*.signing.json"))
          signing = "UNKNOWN"
          if signing_files:
              signing = json.loads(signing_files[0].read_text(encoding="utf-8")).get("signing", "UNKNOWN")
          if signing == "SIGNED":
              note = "Authenticode signed."
          elif signing == "UNSIGNED":
              note = "UNSIGNED. Authenticode does not identify the publisher."
          else:
              sys.exit("The signing metadata is missing. The manifest was not written.")
          manifest = {
              "version": version,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "signing": signing,
              "notes": note,
              "files": [{"name": exe.name, "sha256": digest}],
          }
          (folder / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
          EOF

      - name: Upload to the server
        # No --delete: earlier versions stay downloadable for reinstalling tills that must match.
        run: |
          ssh server "mkdir -p $DOWNLOADS_DIR/pos"
          rsync -az release/ "server:$DOWNLOADS_DIR/pos/"
