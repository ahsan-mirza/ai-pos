name: Release POS

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-pos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$app_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $app_version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons if missing
        run: test -f apps/desktop/src-tauri/icons/icon.ico || node scripts/generate-icon.mjs

      - name: Build installers
        run: pnpm build:pos:prod

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-pos-windows-${{ github.run_number }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AI POS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  # Copies the installers to the server, where Super Admins download them from the portal (Downloads page).
  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    env:
      DOWNLOADS_DIR: /opt/ai-pos/downloads
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-pos-windows-${{ github.run_number }}
          path: artifact

      - name: Stage installers and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "release/$version"
          find artifact -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} "release/$version/" \;
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md || true
          python3 - "release/$version" "$version" notes.md <<'EOF'
          import hashlib, json, pathlib, sys
          from datetime import datetime, timezone

          folder, version, notes_path = pathlib.Path(sys.argv[1]), sys.argv[2], pathlib.Path(sys.argv[3])
          files = [
              {"name": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
              for path in sorted(folder.iterdir())
              if path.suffix.lower() in {".exe", ".msi"}
          ]
          if not files:
              sys.exit("No installers in the build artifact.")
          notes = notes_path.read_text(encoding="utf-8").strip() if notes_path.exists() else ""
          manifest = {
              "version": version,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": notes[:2000] or None,
              "files": files,
          }
          (folder / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
          EOF

      - name: Upload to the server
        # No --delete: earlier versions stay downloadable for reinstalling tills that must match.
        run: |
          ssh server "mkdir -p $DOWNLOADS_DIR/pos"
          rsync -az release/ "server:$DOWNLOADS_DIR/pos/"
