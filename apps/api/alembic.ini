[alembic]
script_location = alembic
prepend_sys_path = .
# space, not os.pathsep: one committed file has to split the same way on Windows and Linux.
# These three folders are one tenant history. Reach owns 20261105_0099; Delivery owns 20261105_0098.
path_separator = space
version_path_separator = space
version_locations = %(here)s/alembic/versions %(here)s/../../plugins/reach/backend/migrations %(here)s/../../plugins/delivery/backend/migrations
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
