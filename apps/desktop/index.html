<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI POS Checkout</title>
    <link rel="icon" type="image/svg+xml" href="/brand/fav-icon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/brand/fav-icon-white.svg" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root">
      <div style="display:flex;height:100vh;background:#f8fafc;color:#18181b">
        <div style="display:none"></div>
        <aside style="width:18rem;border-inline-end:1px solid #e4e4e7;flex:none"></aside>
        <div style="flex:1;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;align-content:start">
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
          <div style="aspect-ratio:4/3;background:#e4e4e7;border-radius:16px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
