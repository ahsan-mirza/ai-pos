<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f26a21" />
    <title>Business Pro is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #eaeaea;
        color: #222026;
        font-family: Archivo, ui-sans-serif, sans-serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        background: #fff;
        border-radius: 20px;
        padding: 28px;
      }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0; line-height: 1.5; color: #3f3f46; }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 999px;
        background: #f26a21;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Business Pro is offline</h1>
      <p>
        The app shell is on this device. Sales, customers, inventory, and reports stay on the server and are not available until the connection returns.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
