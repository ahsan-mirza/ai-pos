# Disposable pharmacy acceptance database. This file is not the development Compose project.
# It does not mount ai_pos_pg and it publishes Postgres on loopback only.
name: axizpos-pharmacy-acceptance

services:
  postgres:
    container_name: axizpos-pharmacy-acceptance-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axizpos_acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_DB_PASSWORD}
      POSTGRES_DB: axizpos_pharmacy_acceptance
    ports:
      - "127.0.0.1:${ACCEPTANCE_DB_PORT}:5432"
    volumes:
      - axizpos_pharmacy_acceptance_pg:/var/lib/postgresql/data
    networks:
      - acceptance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axizpos_acceptance -d axizpos_pharmacy_acceptance"]
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  acceptance:
    name: axizpos-pharmacy-acceptance-net

volumes:
  axizpos_pharmacy_acceptance_pg:
    name: axizpos-pharmacy-acceptance-pg
