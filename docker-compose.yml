services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_pos
      POSTGRES_PASSWORD: ai_pos
      POSTGRES_DB: ai_pos
    ports:
      - "5432:5432"
    volumes:
      - ai_pos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_pos -d ai_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ai_pos_pg:
