# Proposed only. Do not install this until port 443 is confirmed open on the host.
# The current ai-pos.conf keeps HTTP working on purpose: a closed 443 must not take the site offline,
# and /.well-known/acme-challenge/ must stay on port 80.
#
# This fragment replaces the port 80 server blocks in ai-pos.conf.
# It does not replace the HTTPS server in ai-pos.https.conf.
# https://axizpos.com is not redirected again, so the apex does not loop.
# Store hosts redirect to their own HTTPS name. They are not folded into the apex.

server {
    listen 80;
    listen [::]:80;
    server_name www.axizpos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://axizpos.com$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name axizpos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://axizpos.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name *.axizpos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
