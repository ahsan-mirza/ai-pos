# Admin portal and API for every store: https://<store>.qios.ae serves the portal and proxies /api to the
# FastAPI process, which resolves the tenant from the Host header. Needs a certificate for qios.ae and
# *.qios.ae (see deploy/README.md).

upstream ai_pos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name qios.ae *.qios.ae;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qios.ae *.qios.ae;

    ssl_certificate /etc/letsencrypt/live/qios.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qios.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Product imports and bank statements are uploaded through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/ai-pos-admin;
    index index.html;

    location ~ ^/(api/|health$|docs(/|$)|redoc$|openapi\.json$) {
        proxy_pass http://ai_pos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
