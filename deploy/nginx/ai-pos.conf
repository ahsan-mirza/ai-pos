# Portal, marketing site, and API for axizpos.com.
# https://axizpos.com/ is the landing page. Sign-in is /login and signup is /signup.
# Store hosts (*.axizpos.com) keep the portal at /.
# The console is at /admin74246/. /api and /health are proxied to FastAPI.
# Port 80 keeps serving the same routes. server-setup.sh adds the 443 block
# from ai-pos.https.conf when the existing Let's Encrypt files are on the host.
# HTTP is not redirected to HTTPS: a closed cloud port 443 must not take the site offline,
# and /.well-known/acme-challenge/ stays on port 80 for certificate renewal.

upstream ai_pos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ai_pos_admin {
    server 127.0.0.1:4173;
    keepalive 16;
}

upstream ai_pos_console {
    server 127.0.0.1:4174;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name axizpos.com www.axizpos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    include /etc/nginx/snippets/ai-pos.shared.conf;
    include /etc/nginx/snippets/ai-pos.apex.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.axizpos.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    include /etc/nginx/snippets/ai-pos.shared.conf;
}

include /etc/nginx/snippets/ai-pos.https.conf;
