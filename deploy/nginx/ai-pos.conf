# Portal and API for axizpos.com, over HTTP until a certificate is issued.
# Open http://axizpos.com/ for the portal. The console is at /admin74246/.
# /api and /health are proxied to FastAPI.
# After DNS points here: sudo certbot --nginx -d axizpos.com -d www.axizpos.com

upstream ai_pos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ai_pos_admin {
    server 127.0.0.1:4173;
    keepalive 16;
}

upstream ai_pos_console {
    server 127.0.0.1:4174;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name axizpos.com www.axizpos.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Product imports and bank statements are uploaded through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/ai-pos-admin;
    index index.html;

    location ~ ^/(api/|health$|docs(/|$)|redoc$|openapi\.json$) {
        proxy_pass http://ai_pos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # The prefix is stripped so the console static server sees / and /tenants.
    location = /admin74246 {
        return 301 /admin74246/;
    }

    location /admin74246/ {
        proxy_pass http://ai_pos_console/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The portal is the PM2 admin process, so its access log is `pm2 logs ai-pos-admin`.
    location / {
        proxy_pass http://ai_pos_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
