# Portal and API on the VM's public IP, over HTTP, until a domain and certificate exist.
# Open http://<public-ip>/ for the portal. /api and /health are proxied to FastAPI.
# When a domain is ready, add a TLS server for that name and redirect port 80 to it.

upstream ai_pos_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ai_pos_admin {
    server 127.0.0.1:4173;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Product imports and bank statements are uploaded through the API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/ai-pos-admin;
    index index.html;

    location ~ ^/(api/|health$|docs(/|$)|redoc$|openapi\.json$) {
        proxy_pass http://ai_pos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # The portal is the PM2 admin process, so its access log is `pm2 logs ai-pos-admin`.
    location / {
        proxy_pass http://ai_pos_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
