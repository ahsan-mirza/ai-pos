# Included only for axizpos.com. www.axizpos.com redirects to this host before the include.
# `/` is the marketing site. /login and /signup stay on the portal via the shared `location /`.
# If the marketing build is not on disk yet, `/` falls through to the portal.

location /site-assets/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /pos/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /brand/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /portal/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

# Marketing photos live under /images/. Without this, they fall through to the portal and the browser receives index.html.
location /images/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location = /robots.txt {
    root /var/www/ai-pos-site;
    default_type text/plain;
}

location = /sitemap.xml {
    root /var/www/ai-pos-site;
    default_type application/xml;
}

# One canonical path per landing page. Trailing slashes and /index.html files redirect.
# Homepage sections and retired aliases redirect too, so they are not a second copy of a page.
location ~ ^/(restaurant-pos|retail-pos|grocery-pos|cafe-pos|quick-service-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae|offline-pos|inventory-management|multi-branch-pos|imei-serial-tracking|kitchen-display|loyalty-promotions|blog|hardware|explore|ai-pos)/$ {
    return 301 $scheme://axizpos.com/$1$is_args$args;
}

location ~ ^/(restaurant-pos|retail-pos|grocery-pos|cafe-pos|quick-service-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae|offline-pos|inventory-management|multi-branch-pos|imei-serial-tracking|kitchen-display|loyalty-promotions|blog|hardware|explore|ai-pos)/index\.html$ {
    return 301 $scheme://axizpos.com/$1$is_args$args;
}

location = /ar/ {
    return 301 $scheme://axizpos.com/ar;
}

location ~ ^/((?:blog|ar)(?:/[a-z0-9-]+)+)/$ {
    return 301 $scheme://axizpos.com/$1$is_args$args;
}

location ~ ^/(solutions|features|industries|pricing|contact)/?$ {
    return 301 $scheme://axizpos.com/#$1;
}

location = /supermarket-pos {
    return 301 $scheme://axizpos.com/grocery-pos;
}

location = /supermarket-pos/ {
    return 301 $scheme://axizpos.com/grocery-pos;
}

location = /ai {
    return 301 $scheme://axizpos.com/#intelligence;
}

location = /ai/ {
    return 301 $scheme://axizpos.com/#intelligence;
}

location = /copilot {
    return 301 $scheme://axizpos.com/#intelligence;
}

location = /copilot/ {
    return 301 $scheme://axizpos.com/#intelligence;
}

# These paths are not pages. A 404 keeps the portal shell from answering them with noindex HTML.
location = /home { return 404; }
location = /home/ { return 404; }

location = /404.html {
    root /var/www/ai-pos-site;
    internal;
    add_header X-Robots-Tag "noindex" always;
}

location = /blog {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    try_files /blog/index.html =404;
}

location = /ar {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    try_files /ar/index.html =404;
}

location ^~ /blog/ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    try_files $uri $uri/index.html =404;
}

location ^~ /ar/ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    try_files $uri $uri/index.html =404;
}

location = /home-2 {
    return 301 https://axizpos.com/$is_args$args;
}

location = /home-2/ {
    return 301 https://axizpos.com/$is_args$args;
}

location = /home-2/index.html {
    return 301 https://axizpos.com/$is_args$args;
}

# Alternate homepage. Same intent as /. A direct 301 avoids a second hop through /home-3.
location = /home-3 {
    return 301 https://axizpos.com/$is_args$args;
}

location = /home-3/ {
    return 301 https://axizpos.com/$is_args$args;
}

location = /home-3/index.html {
    return 301 https://axizpos.com/$is_args$args;
}

# These URLs are not published pages. 404 here, with the marketing page, instead of the portal shell.
location ~ ^/(pharmacy-pos|privacy|about|terms|refund)/?$ {
    root /var/www/ai-pos-site;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex" always;
    return 404;
}

location ~ ^/(restaurant-pos|retail-pos|grocery-pos|cafe-pos|quick-service-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae|offline-pos|inventory-management|multi-branch-pos|imei-serial-tracking|kitchen-display|loyalty-promotions|hardware|explore|ai-pos)$ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 /404.html;
    try_files /$1/index.html =404;
}

# Product and package URLs stay on the hardware page. The page reads the path after it loads.
location ^~ /hardware/ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /hardware/index.html;
}

# /index.html is the portal application shell. The service worker precaches this URL and
# serves it for /login and every other app route. It must not be the marketing page.
location = /index.html {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# `/` stays the marketing file. `break` serves it here and does not re-enter /index.html.
location = / {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 = @portal;
    rewrite ^ /index.html break;
}

location @portal {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Unknown apex paths. Earlier exact, ^~, and regex locations still win for real marketing pages.
# Application routes and asset prefixes stay on the portal or the API. A new portal prefix must be added here.
location ~ ^/(?!login(?:/|$)|signup(?:/|$)|welcome(?:/|$)|demo(?:/|$)|kds(?:/|$)|table(?:/|$)|m(?:/|$)|inventory(?:/|$)|dashboard(?:/|$)|account(?:/|$)|subscription(?:/|$)|terminals(?:/|$)|customers(?:/|$)|sales(?:/|$)|fulfillment(?:/|$)|sales-orders(?:/|$)|reorders(?:/|$)|rentals(?:/|$)|repairs(?:/|$)|returns(?:/|$)|users(?:/|$)|warranties(?:/|$)|margin(?:/|$)|expenses(?:/|$)|payables(?:/|$)|consignment(?:/|$)|staff(?:/|$)|assistant(?:/|$)|accounting(?:/|$)|bank(?:/|$)|insights(?:/|$)|sales-insights(?:/|$)|reports(?:/|$)|einvoicing(?:/|$)|analytics(?:/|$)|promotions(?:/|$)|trade-ins(?:/|$)|store-credit(?:/|$)|gift-cards(?:/|$)|payments(?:/|$)|cheques(?:/|$)|shifts(?:/|$)|reach(?:/|$)|stores(?:/|$)|roles(?:/|$)|settings(?:/|$)|registers(?:/|$)|downloads(?:/|$)|deliveries(?:/|$)|admin(?:/|$)|forgot-password(?:/|$)|recover-store-code(?:/|$)|assets(?:/|$)|icons(?:/|$)|images(?:/|$)|brand(?:/|$)|pos(?:/|$)|portal(?:/|$)|site-assets(?:/|$)|media(?:/|$)|api(?:/|$)|health$|docs(?:/|$)|redoc$|openapi\.json$|admin74246(?:/|$)|sw\.js$|workbox-|manifest\.webmanifest$|favicon\.ico$|registerSW\.js$|robots\.txt$|sitemap\.xml$|index\.html$|404\.html$|offline\.html$).+ {
    root /var/www/ai-pos-site;
    error_page 404 /404.html;
    add_header X-Robots-Tag "noindex" always;
    return 404;
}
