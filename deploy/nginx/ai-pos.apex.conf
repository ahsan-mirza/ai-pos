# Included only for axizpos.com and www.axizpos.com.
# `/` is the marketing site. /login and /signup stay on the portal via the shared `location /`.
# If the marketing build is not on disk yet, `/` falls through to the portal.

location /site-assets/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /pos/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /brand/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /portal/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location = /robots.txt {
    root /var/www/ai-pos-site;
    default_type text/plain;
}

location = /sitemap.xml {
    root /var/www/ai-pos-site;
    default_type application/xml;
}

# Marketing pages. A trailing slash redirects to the canonical path.
location ~ ^/(restaurant-pos|retail-pos|cafe-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae)/$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(restaurant-pos|retail-pos|cafe-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae)$ {
    root /var/www/ai-pos-site;
    try_files /$1/index.html =404;
}

location = /index.html {
    root /var/www/ai-pos-site;
}

location = / {
    root /var/www/ai-pos-site;
    try_files /index.html @portal;
}

location @portal {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
