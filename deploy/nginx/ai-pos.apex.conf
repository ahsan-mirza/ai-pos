# Included only for axizpos.com and www.axizpos.com.
# `/` is the marketing site. /login and /signup stay on the portal via the shared `location /`.
# If the marketing build is not on disk yet, `/` falls through to the portal.

location /site-assets/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /pos/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /brand/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location /portal/ {
    root /var/www/ai-pos-site;
    try_files $uri =404;
}

location = /robots.txt {
    root /var/www/ai-pos-site;
    default_type text/plain;
}

location = /sitemap.xml {
    root /var/www/ai-pos-site;
    default_type application/xml;
}

# Marketing pages. A trailing slash redirects to the canonical path.
location ~ ^/(restaurant-pos|retail-pos|grocery-pos|cafe-pos|quick-service-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae)/$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(restaurant-pos|retail-pos|grocery-pos|cafe-pos|quick-service-pos|wholesale-pos|fashion-pos|electronics-pos|pos-software-uae)$ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files /$1/index.html =404;
}

# /index.html is the portal application shell. The service worker precaches this URL and
# serves it for /login and every other app route. It must not be the marketing page.
location = /index.html {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Homepage sections are the marketing page. The page itself moves the visitor to the matching anchor.
location ~ ^/(solutions|features|industries|pricing|contact)/?$ {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    rewrite ^ /index.html break;
}

# `/` stays the marketing file. `break` serves it here and does not re-enter /index.html.
location = / {
    root /var/www/ai-pos-site;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    error_page 404 = @portal;
    rewrite ^ /index.html break;
}

location @portal {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
