# Shared by the HTTP and HTTPS server blocks. Included from inside `server { }`.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Product imports and bank statements are uploaded through the API.
client_max_body_size 25m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

root /var/www/ai-pos-admin;
index index.html;

location ~ ^/(api/|health$|docs(/|$)|redoc$|openapi\.json$) {
    proxy_pass http://ai_pos_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
}

# Product photos are files on the API (/media/{tenant}/products/{key}.webp).
# Without this, /media falls through to the portal and the browser receives index.html.
location /media/ {
    proxy_pass http://ai_pos_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
}

# The prefix is stripped so the console static server sees / and /tenants.
location = /admin74246 {
    return 301 /admin74246/;
}

location /admin74246/ {
    proxy_pass http://ai_pos_console/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# The portal is the PM2 admin process, so its access log is `pm2 logs ai-pos-admin`.
# That process falls back to index.html for client-side routes.
location / {
    proxy_pass http://ai_pos_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}
