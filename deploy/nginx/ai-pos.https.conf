# Installed only when the certificate files below already exist on the host.
# The private key stays on the server. Do not copy it into this repository.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name axizpos.com www.axizpos.com;

    ssl_certificate /etc/letsencrypt/live/axizpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axizpos.com/privkey.pem;

    include /etc/nginx/snippets/ai-pos.shared.conf;
}
